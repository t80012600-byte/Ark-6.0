name: Ark 6.0 Scraper

on:
  schedule:
    # 🌅 晨間戰報：台灣時間早上 07:15 (UTC 23:15, 前一天)
    - cron: '15 23 * * *'
    # 🌃 夜間戰報：台灣時間晚上 21:45 (UTC 13:45)
    - cron: '45 13 * * *'
  workflow_dispatch: # 保留手動測試按鈕，讓您可以隨時點擊發射

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance pandas_ta pytz

      - name: Run Scraper
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python ark_scraper.py 
        # ⚠️ 注意：如果您外層的 Python 檔名不是 ark_scraper.py，請將上面這行改為您的實際檔名
