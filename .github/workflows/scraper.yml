name: Ark 6.0 Auto Scraper Pipeline

on:
  schedule:
    # 台灣時間 22:00 (UTC 14:00) 執行 (週一至週五)
    - cron: '0 14 * * 1-5'
    # 台灣時間 07:00 (UTC 23:00) 執行 (週一至週五的 UTC，等於台灣的週二到週六)
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕強制執行測試

jobs:
  Deploy-Ark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Armor (Dependencies)
        run: pip install -r requirements.txt
        
      - name: Ignite Engine (Run Scraper)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python ark_scraper.py
