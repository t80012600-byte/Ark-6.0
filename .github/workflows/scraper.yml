name: Ark 6.0 Scraper

on:
  schedule:
    # 🌅 晨間戰報：台灣時間早上 07:15 (UTC 23:15, 前一天)
    - cron: '15 23 * * *'
    # 🌃 夜間戰報：台灣時間晚上 21:45 (UTC 13:45)
    - cron: '45 13 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance pandas-ta pytz feedparser

      - name: Run Scraper
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python ark_scraper.py
